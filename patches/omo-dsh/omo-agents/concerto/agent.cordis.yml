# The `concerto` agent preset: orchestration-first (协奏 / Concerto Mode).
#
# This is an AGENT-PLANE composition, mounted once per process by
# dsh-agent-presets when a session picks the concerto mode; the host
# composition owns the registries, the sandbox/approval stack, persistence,
# and the model route (same mounting rules as the shipped presets — a service
# row here must sit inside a group carrying an `isolate` realm).
#
# Derivation ledger against the shipped `standard` preset
# (dsh 0.1.2-alpha.1 packages/preset/agent-presets/presets/standard/agent.cordis.yml).
# The MVP-era derivation ran against dsh 0.1.0-rc.6 at its old location
# config/agent-presets/standard/ (0.1.2 moved the shipped presets into
# packages/preset/agent-presets). T6 scope: a real, WORKING conductor mode.
# T8 landed the omo-sisyphus orchestrator prompt wiring (persona sentinel
# rendered from system-sections markdown at apply() time); per-agent model
# routes are a later milestone, so this file deliberately keeps standard's
# host-compatible core and drops what the 1+1 concerto skeleton does not use.
#
# Note on comment-only diff hunks: concerto carries its own commentary (the
# T8/T11/T12/T13 sentinel documentation and per-row notes) instead of
# standard's header, section, and row-level rationale comments, which are not
# replicated verbatim; section-header text/width may also differ (e.g.
# `delegation` vs `delegation and workflows`). Any diff hunk consisting
# solely of comment/section-header lines is covered by this note; every
# row-level hunk maps to a KEEP/DROP/DEV entry below.
#
# KEEP  persona                      — T8: the value is a SENTINEL (the
#                                      PERSONA_TEXT_SENTINEL constant in
#                                      src/system-prompt.ts), not real text;
#                                      syncConcertoPreset renders it into the
#                                      assembled omo-sisyphus system prompt
#                                      (the four system-sections/*.md files
#                                      in fixed order) at apply() time —
#                                      design (a), see src/system-prompt.ts.
#                                      This is the only row whose semantics
#                                      change.
# KEEP  agent-instructions           — workspace instruction files still apply
#                                      to a conductor's sessions.
# KEEP  tool-bash / tool-pwsh        — platform-gated shell, verbatim from
#                                      standard; the conductor can still run
#                                      and inspect commands itself.
# KEEP  tool-fs / tool-fs-search     — read/write/search the workspace; a
#                                      conductor reviews delegated output.
# KEEP  tool-jobs                    — background-job controls; pairs with the
#                                      continuable background subagents below.
# KEEP  skill-filesystem, tool-skill — skills stay available in concerto.
# KEEP  command-goal                 — 0.1.2 addition to standard; pairs with
#                                      tool-goal (the /goal command plus the
#                                      model-facing goal tool — keeping one
#                                      without the other is asymmetric).
# KEEP  tool-goal                    — goal tracking fits orchestration work.
# KEEP  compaction group             — long orchestration sessions fold
#                                      (compaction-basic, command-compact,
#                                      tool-result-pruner; realm reasons as in
#                                      standard: pruner shares the realm,
#                                      tokenMeter stays host-plane).
# KEEP  delegation group             — THE point of the mode: the control +
#                                      list-agents pair from standard, PLUS the
#                                      full Phase 2 roster (P2-T15): ten
#                                      `dsh-tool-subagent` instances, one per
#                                      roster delegation entry, the T11
#                                      omo-explore instance being the first of
#                                      them. The generic `tool-subagent` /
#                                      `tool-subagent-fork` rows stay DROPPED
#                                      (F1 fix).
# DEV   modelSelectionSettings        — kept ONLY on the generic
#                                      `tool-subagent` (provider: spawn) row,
#                                      as in 0.1.2 standard. NOT on
#                                      `tool-subagent-fork` (standard
#                                      deliberately omits it so provider/model
#                                      stay equal to the parent and the
#                                      inherited history keeps its KV Cache
#                                      prefix — standard's fork comment) and
#                                      NOT on any `tool-subagent-<agent>` row
#                                      (FR-5 pins each route via agentOptions;
#                                      no roster child samples host model
#                                      selection).
# KEEP  tool-ask-user                — the conductor escalates decisions.
# KEEP  tool-todo                    — orchestration tracking.
# KEEP  tool-web                     — research from the conductor seat.
# DEV   tool-web fetch: true         — rc.6-era concerto inherited `fetch:
#                                      false` verbatim from standard (not a
#                                      deliberate deviation); 0.1.2 standard
#                                      sets `fetch: true` — derivation
#                                      discipline: follow upstream unless a
#                                      deviation is recorded. `searchTimeoutMs:
#                                      60000` kept.
# DROP  plan-mode group              — the single-agent plan ceremony is the
#                                      "do it yourself" stance; 编排优先
#                                      decomposes by delegation instead.
#                                      Deliberate MVP cut; T8 may revisit.
# DROP  tool-subagent-codex /
#       tool-subagent-claude-code    — product-provider rows. 0.1.2 standard
#                                      ships them disabled with
#                                      `backgroundMode: one-shot` +
#                                      `maxDepth: provider-managed` and the
#                                      comment "Install the matching Bundle in
#                                      this Profile and restart the Host, then
#                                      copy this preset and remove `disabled`".
#                                      Dropping (not disabling) keeps the MVP
#                                      roster honest; DROP unchanged under
#                                      0.1.2. Per-agent model routes
#                                      (PRD §4.4 piece 4) — noted here as
#                                      landing "with the real agent presets" —
#                                      arrived in Phase 2 on the ten named rows
#                                      below, whose agentOptions is rendered
#                                      from src/model-routes.ts at apply() time.
# DROP  workflow-worker-thread /
#       tool-workflow                — workflow engine rows; not needed for
#                                      the 1+1 (conductor + subagent) skeleton.
# DROP  tool-ralph                   — self-loop construct, out of MVP scope.

# ── identity ────────────────────────────────────────────────────────────────

# The conductor persona: the one semantic change vs standard. The value below
# is a SENTINEL — never mounted as-is: syncConcertoPreset substitutes the
# assembled omo-sisyphus system prompt (a |- block scalar) when it authors
# the preset into $DSH_HOME/.agent-presets/concerto/ (design (a), T8; see
# src/system-prompt.ts). `{{model}}` / `{{cwd}}` are intentionally absent:
# the assembled markdown is variable-free (the builder rejects `{{`
# sequences, which dsh renderPrompt would fail on), and dsh-persona's
# includeRuntimeContext default already appends the runtime snapshot.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: __OMO_SISYPHUS_SYSTEM_PROMPT__
    # Upstream parity (0.1.5-rc.1 standard). A preset persona row shadows the
    # deployment SUFFIX as well as the prefix
    # (dsh-persona/src/index.ts:53-58 registers both sections), so omitting
    # this drops the cwd line the deployment would otherwise supply. Safe here:
    # the `{{` ban in system-prompt.ts guards the ASSEMBLED markdown, not this
    # separate config value.
    suffix: Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────

# The `subagents` registry and its backends stay host-plane (process singleton,
# see the standard preset's header); this group contributes the delegation
# tools the conductor calls, behind the entry-local workflowEngine realm.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    # HARDENING (PR #1 review F1 fix, 2026-09-04 — P-19 sync with the
    # current-DSH path): the generic `tool-subagent` / `tool-subagent-fork`
    # rows are DROPPED. Their children are unrestricted full agents (no
    # toolFilter, default depth budget 3), so a conductor that picked them
    # instead of a named roster agent bypassed every guardrail. With them gone,
    # the ten rows below are the conductor's ONLY delegation paths — same
    # verdict as patches/omo-dsh/omo-agents-current/ (2026-09-04).
    #
    # PHASE 2 (P2-T15; plan §4.4/§4.5, phase2-roster.md §1 总表): the T11
    # single-instance shape generalizes to the FULL roster — one
    # dsh-tool-subagent instance per roster DELEGATION entry, in ROSTER ORDER
    # (explore, hephaestus, oracle, librarian, plan-consultant, plan-reviewer,
    # atlas, multimodal-looker, sisyphus-junior, prometheus), so the conductor
    # sees exactly ten named delegation tools. sisyphus (the conductor) is NOT
    # here: it is the main-session persona row above and holds no delegation
    # tool of its own (roster.ts expresses that as `delegation: false`).
    #
    # SINGLE-SOURCE discipline — no prompt text, no route literal and no deny
    # list is pasted into this file. THREE sentinel families are rendered by
    # syncConcertoPreset (src/concerto-preset.ts `renderAgentSentinels`) from
    # the single sources at apply() time — same mechanism as the T8 persona
    # sentinel. Each one is spelled `agentSentinelName(id, kind)`: the row id
    # upper-cased with hyphens folded to underscores (the roster.ts env-name
    # convention), framed by the plugin's sentinel delimiters; the delimiter
    # literal itself is deliberately never written in this file, so "the
    # template still carries a sentinel" stays a grep-able, unambiguous
    # statement about the rendered artifact.
    #   persona       sentinel                 ← buildAgentPersona(id)
    #                (src/persona-prompts.ts, reading system-sections/
    #                <id>-persona.md; the T11 explore instance used the T10
    #                explore-prompt.ts wrapper, which is now a thin alias of
    #                the same builder). The spawn provider declares the
    #                `persona` capability, so the text shadows the child's
    #                deployment persona (tool-subagent/src/index.ts:92,384).
    #   agentOptions  sentinel                 ← resolveModelRoutes()[id]
    #                (src/model-routes.ts ← roster.ts defaults + the
    #                OMO_<AGENT>_{PROVIDER,MODEL} env pair, T14/P2-T3).
    #                Env-overridable, so the route MUST be resolved at apply()
    #                time — a static literal would fork the single source of
    #                truth. Rendered as JSON-quoted YAML scalars
    #                (injection-safe).
    #   deny          sentinel                 ← denyToolNamesFor(roster row)
    #                (src/roster.ts), rendered as a YAML flow sequence of
    #                JSON-quoted names. PER-ROW UNIQUE (the id is part of the
    #                sentinel) because the exactly-once guard applies to each
    #                row independently; one shared sentinel string across rows
    #                would collide with that guard, and a static list would
    #                make adding an agent an eleven-line YAML edit.
    # Sentinel census: 1 conductor `prefix` (T8) + 10 persona + 10 agentOptions
    # + 8 deny = 29. syncConcertoPreset renders all of them and then rejects any
    # surviving sentinel residue, so a missed or doubled sentinel is a loud
    # apply-time failure (R-7 discipline).
    #
    # toolFilter BY CLASS (plan §4.4 mirror table: OMO `permission` semantics →
    # the DSH `toolFilter` of each instance; per-row Config validity is checked
    # by doctor-lite against the installed schema, the class shape is pinned
    # statically by c10):
    #   read-only (explore, oracle, librarian, plan-consultant, plan-reviewer,
    #                prometheus — 6 rows): deny the mutation tools (write, edit
    #                — dsh-tool-fs is never platform-gated, so both names
    #                always exist for the child's restrict()) PLUS all ten
    #                delegation tool names. OMO parity: its read-only agents
    #                deny write/edit/apply_patch/task/call_omo_agent —
    #                apply_patch does not exist in dsh and task/call_omo_agent
    #                map onto the ten named tools. F1 generalization (PR #1
    #                review, 2026-09-04): a read-only child must not even SEE
    #                another agent's delegation tool (physical absence beats
    #                refusal), so nested delegation is impossible by
    #                construction — stronger than the depth cap alone, which
    #                stays as defense-in-depth (AC-6b parity with the
    #                current-DSH path).
    #   worker (hephaestus, sisyphus-junior — 2 rows): deny all ten delegation
    #                names; write/edit stay, because both are write-capable
    #                executors (phase2-roster.md §2.2/§2.9).
    #   orchestrator (atlas): NO `toolFilter` key at all. atlas is the ONE
    #                sub-agent that keeps the delegation tools and may delegate
    #                again (plan §4.5); its cap is the structural `maxDepth: 2`
    #                below (conductor depth 0 → atlas 1 → worker 2).
    #   allowlist (multimodal-looker): the STATIC `allow: [read, read_image]`
    #                on its row below — short list, no sentinel. `read` alone
    #                would hide `read_image` (conditionally registered by
    #                dsh-tool-fs while `attachments` is mounted) and close the
    #                vision entry point (plan §4.4 H-1); name-drift risk: R-9.
    #   `bash` is deliberately NOT denied on any row (T12 verdict a): it is
    #   platform-gated (absent on win32 — a deny would throw "unknown global
    #   tool" at the child's restrict() there) and OMO's read-only agents keep
    #   shell access; write-capable commands are governed by each persona's
    #   read-only declarations plus the T16 hard-blocks injection.
    #
    # maxDepth: a FLAT `maxDepth` field (tool-subagent/src/index.ts:98,
    # z.natural()|'provider-managed', default 3) — there is NO `policy`
    # wrapper. atlas = 2; every other row = 1. Enforcement proven through the
    # real start path (scripts/prove-explore-maxdepth.mjs, T13): a depth-1
    # parent's nested-delegation attempt is rejected on BOTH the foreground and
    # continuable starts with the errored tool result "Error: subagent depth 2
    # exceeds maxDepth 1" (resolveChildDepth → SubagentDepthError,
    # child-agent.ts:48-56, before any child exists), a depth-0 parent passes
    # (control), absent → default 3, and 'provider-managed' sends no cap. SINCE
    # the F1 fix the cap is defense-in-depth for the deny-ing rows: their
    # delegation tools are already absent from the child's tool list, so the
    # depth gate no longer fires in the e2e nested-delegation scenario (which
    # asserts the unknown-tool rejection instead).
    # NOT SETTABLE in form A: a custom tool `description`. The schema has no
    # such field; the model-facing description is generated from the spawn
    # provider's inheritsParentContext=false wording
    # (tool-subagent/src/index.ts providerWording). Unknown keys are silently
    # PRESERVED by schemastery (verified on the installed rc.6), so a bogus
    # `description:` key would be dead config, not an error — recorded as a
    # P-4/P-5 delta; the probe pins the real generated wording instead.

    # explore — read-only code retrieval (phase2-roster.md §2.1). The T11 row,
    # changed ONLY in its deny value: the inline [write, edit, explore] literal
    # became the roster-computed sentinel (P2-T15), whose rendered list is the
    # full six-row read-only class list.
    - id: tool-subagent-explore
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: explore
        backgroundMode: continuable
        persona: __OMO_EXPLORE_PERSONA__
        agentOptions: __OMO_EXPLORE_AGENT_OPTIONS__
        toolFilter:
          deny: __OMO_EXPLORE_DENY__
        maxDepth: 1

    # hephaestus — worker class: autonomous deep worker ("a goal, not a
    # recipe"), write-capable, no delegation (phase2-roster.md §2.2).
    - id: tool-subagent-hephaestus
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: hephaestus
        backgroundMode: continuable
        persona: __OMO_HEPHAESTUS_PERSONA__
        agentOptions: __OMO_HEPHAESTUS_AGENT_OPTIONS__
        toolFilter:
          deny: __OMO_HEPHAESTUS_DENY__
        maxDepth: 1

    # oracle — read-only class: high-IQ architecture/debug advisor with a
    # binding structured output contract (phase2-roster.md §2.3).
    - id: tool-subagent-oracle
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: oracle
        backgroundMode: continuable
        persona: __OMO_ORACLE_PERSONA__
        agentOptions: __OMO_ORACLE_AGENT_OPTIONS__
        toolFilter:
          deny: __OMO_ORACLE_DENY__
        maxDepth: 1

    # librarian — read-only class: documentation / OSS source search; inherits
    # the web tools from this composition (phase2-roster.md §2.4).
    - id: tool-subagent-librarian
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: librarian
        backgroundMode: continuable
        persona: __OMO_LIBRARIAN_PERSONA__
        agentOptions: __OMO_LIBRARIAN_AGENT_OPTIONS__
        toolFilter:
          deny: __OMO_LIBRARIAN_DENY__
        maxDepth: 1

    # plan-consultant — read-only class: pre-plan gap analysis (OMO v4 name
    # metis; v5 naming anchor, phase2-roster.md §2.5).
    - id: tool-subagent-plan-consultant
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: plan-consultant
        backgroundMode: continuable
        persona: __OMO_PLAN_CONSULTANT_PERSONA__
        agentOptions: __OMO_PLAN_CONSULTANT_AGENT_OPTIONS__
        toolFilter:
          deny: __OMO_PLAN_CONSULTANT_DENY__
        maxDepth: 1

    # plan-reviewer — read-only class: adversarial plan review (OMO v4 name
    # momus; v5 naming anchor, phase2-roster.md §2.6). Hyphenated tool names
    # are legal under the OpenAI-compatible tool-name pattern (R-1).
    - id: tool-subagent-plan-reviewer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: plan-reviewer
        backgroundMode: continuable
        persona: __OMO_PLAN_REVIEWER_PERSONA__
        agentOptions: __OMO_PLAN_REVIEWER_AGENT_OPTIONS__
        toolFilter:
          deny: __OMO_PLAN_REVIEWER_DENY__
        maxDepth: 1

    # atlas — orchestrator class: the ONE sub-agent that keeps the delegation
    # tools, hence deliberately NO toolFilter key; maxDepth 2 is its structural
    # cap (conductor 0 → atlas 1 → worker 2, plan §4.5; phase2-roster.md §2.7).
    - id: tool-subagent-atlas
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: atlas
        backgroundMode: continuable
        persona: __OMO_ATLAS_PERSONA__
        agentOptions: __OMO_ATLAS_AGENT_OPTIONS__
        maxDepth: 2

    # multimodal-looker — allowlist class: the vision entry point. The filter is
    # a STATIC short list (no sentinel): `read` alone would hide `read_image`,
    # which dsh-tool-fs registers conditionally while `attachments` is mounted
    # (plan §4.4 H-1; phase2-roster.md §2.8). Name-drift risk: R-9.
    - id: tool-subagent-multimodal-looker
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: multimodal-looker
        backgroundMode: continuable
        persona: __OMO_MULTIMODAL_LOOKER_PERSONA__
        agentOptions: __OMO_MULTIMODAL_LOOKER_AGENT_OPTIONS__
        toolFilter:
          allow: [read, read_image]
        maxDepth: 1

    # sisyphus-junior — worker class: focused, write-capable executor without
    # delegation rights (phase2-roster.md §2.9).
    - id: tool-subagent-sisyphus-junior
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: sisyphus-junior
        backgroundMode: continuable
        persona: __OMO_SISYPHUS_JUNIOR_PERSONA__
        agentOptions: __OMO_SISYPHUS_JUNIOR_AGENT_OPTIONS__
        toolFilter:
          deny: __OMO_SISYPHUS_JUNIOR_DENY__
        maxDepth: 1

    # prometheus — read-only class: interview-style strategic planning; as a
    # delegation target its interviewer is the conductor, not the user
    # (phase2-roster.md §2.10).
    - id: tool-subagent-prometheus
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: prometheus
        backgroundMode: continuable
        persona: __OMO_PROMETHEUS_PERSONA__
        agentOptions: __OMO_PROMETHEUS_AGENT_OPTIONS__
        toolFilter:
          deny: __OMO_PROMETHEUS_DENY__
        maxDepth: 1

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# Upstream parity (added to every shipped preset at dsh-v0.1.5-alpha.2).
- id: present
  name: '@deepseek-ai/dsh-tool-present'
