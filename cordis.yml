# oh-my-opendsh patch overlay, applied after the profile's bundle layers via
# `dsh --profile <name> --patch ./cordis.yml` (see scripts/cold-start.sh).
#
# Schema reality (P-8): a --patch file is a top-level YAML array of PATCH
# entries, not an entry list. A plain `- id:/name:` row only overrides an
# existing row and is skipped with `patch: entry "<id>" not found` against the
# always-empty profile root — mounting a new plugin requires the `insert:` form
# below. `name` resolves as a Node module specifier from the PROFILE directory
# ($DSH_HOME/profiles/<name>/), so the bare package name requires the package
# to be installed into that profile (`dsh plugin --profile <name> add <dir>`).
#
# TWO insert rows since P3-T3 — one per plugin, in mount order. omo-agents owns
# the roster / persona / model-route / hard-blocks layer; omo-hooks owns the
# Phase 3 behaviour-guardrail listeners (patches/omo-dsh/omo-hooks). They are
# separate packages on purpose (plan §4.1: folding the hooks into omo-agents
# would turn the roster plugin into a junk drawer), so a profile must install
# BOTH (`dsh plugin --profile web add <dir>` twice — scripts/cold-start.sh,
# tests/e2e/drive.mjs, scripts/concerto-mode-probe.sh, scripts/smoke-real.mjs).
# Measured (dsh 0.1.5-rc.1): a profile missing one package fails the whole boot
# naming that package's own row — `plugin tree failed to load: failed to import
# loader entry omo-hooks (@oh-my-opendsh/omo-hooks): Cannot find package …`
# (ERR_MODULE_NOT_FOUND) — never a half-mounted overlay.
# scripts/doctor-lite.mjs check `cordis-plugins` pins exactly these two ids.

- insert:
    - id: omo-agents
      name: '@oh-my-opendsh/omo-agents'

- insert:
    - id: omo-hooks
      name: '@oh-my-opendsh/omo-hooks'
