# oh-my-opendsh — three-party compatibility matrix (single source of truth).
#
# Rendered into docs/compat-matrix.md / docs/compat-matrix_zh-CN.md by
# scripts/render-compat-matrix.mjs (run it after editing; scripts/release.sh
# and the docs-consistency gate re-run it automatically).
#
# Parties:
#   our = this repo (semver X.Y.Z; tag convention per the release process:
#         immutable vX.Y.Z plus a moving minor alias vX.Y that
#         scripts/install-concerto.sh pins — installs always get the newest
#         stable patch of the line)
#   dsh = @deepseek-ai/dsh (RUNTIME compatibility — the harness our preset and
#         plugin run on; probed via npm registry and git tags `dsh-v*`)
#   omo = oh-my-openagent (architecture REFERENCE — semantic source of the
#         conductor/explore design; tracked for awareness, not runtime compat.
#         D14 (2026-09-11): baseline FROZEN at v4.19.4 — no v5.0 beta tracking,
#         code intake = SUL-1.0 git vendoring, upstream changelog read once per
#         own release node. See docs/decisions.md D14 + docs/roadmap.md §2)
#
# Row status: tested | untested | broken | dropped — see docs/release-process.
# Release gate: the row a release is made on must be `tested`.

schema: 1

our:
