# compat-probe.yml — the weekly zero-cost upstream sentinel (release process,
# decision D13). No secrets, no LLM: it asks the npm registry for EVERY
# dist-tag of @deepseek-ai/dsh and oh-my-openagent (latest/next/alpha/…),
# compares them with every dsh/omo value already recorded in .omo/compat.yaml
# (tested OR untested), and opens ONE `compat-probe` issue per NEW version
# with the local probe instructions (dedup by open issue title). The real
# verification runs locally: scripts/compat-probe.sh + concerto_verify —
# cloud stays free.

name: compat-probe

on:
  schedule:
    - cron: '17 2 * * 1' # weekly, Monday 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: compat-probe
  cancel-in-progress: true

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The sentinel loads .omo/compat.yaml with the installed dsh's js-yaml
      # (the shared read-only dialect loader from scripts/doctor-lite.mjs).
      # Same cutoff caveat as ci.yml (the lesson carries across generations): the
      # version pin alone leaves every caret-ranged transitive floating, and the
      # monorepo does not publish its family atomically — so `--before` must sit
      # strictly between the pinned family's MAX publish instant and the
      # successor family's MIN publish instant, picked by PUBLISH TIME from the
      # registry time map. Since the D17 cutover the sentinel rides the SAME pin
      # as ci.yml (0.2.0-rc.2; 0.1.x compatibility is dropped): the committed
      # 2026-10-01T07:24:55.067Z is the midpoint between 0.2.0-rc.2
      # (2026-09-29T09:56:27.792Z) and its earliest-later version 0.2.1-alpha.1
      # (2026-10-03T04:53:22.343Z), verified by a real lockfile-only resolution:
      # 278/278 @deepseek-ai/dsh* entries at 0.2.0-rc.2, any depth. REVISIT on
      # every dsh bump: scripts/bump-dsh.sh computes and verifies the safe point,
      # then rewrites the quoted version AND both cutoffs — never hand-edit
      # either. Gate 7 (check-docs-consistency d09) asserts ci.yml and this file
      # carry the same cutoff.
      - name: install dsh (parser provider)
        run: npm install --global "@deepseek-ai/dsh@0.2.0-rc.2" --before=2026-10-01T07:24:55.067Z

      - name: detect new upstream versions → open issue
        # gh needs the token IN THE ENV — `permissions: issues: write` alone
        # leaves the CLI unauthenticated ("set the GH_TOKEN environment
        # variable"), which is exactly what turned the sentinel red 4 times in
        # a row (2026-09-21 … 10-05) with zero issues ever opened (PR #12
        # review, run 37334589138 log).
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-compat-probes.mjs
