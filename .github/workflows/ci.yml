# ci.yml — the CI green set (plan T22, PRD §1.1 #12 + §8, AC-7/AC-8;
# extended 2026-09 by the release process, decision D13).
#
# One job, one linear gate chain — the exact same chain scripts/ci-local.sh
# runs locally (zero-cost gates only; the real-model L2 acceptance
# `concerto_verify` stays a LOCAL release gate by design — no secrets here):
#   1. pnpm typecheck
#   2. pnpm vitest run            (unit)
#   3. pnpm test:e2e              (mock-LLM e2e — zero LLM cost; the driver
#                                  self-sandboxes HOME/XDG/DSH_HOME, boots the
#                                  real dsh binary against a local mock-LLM
#                                  server, no real keys)
#   4. node scripts/doctor-lite.mjs --json
#   5. scripts/verify-licenses.sh
#   6. node scripts/verify-concerto-static.mjs (AC-6/P-19 hardening of the
#                                  shipped preset + plugin artifacts)
#   7. node scripts/check-docs-consistency.mjs (version tokens / matrix
#                                  render / installer pin / CHANGELOG top)
#   8. scripts/run-proofs.sh      (T12 toolFilter / T13 maxDepth / T15 dual-route
#                                  logging / P3-T19 guardrail deny path + R-9 /
#                                  P3-T19 C+E mode mechanisms against the
#                                  INSTALLED dsh / N6 bump-dsh --self-test /
#                                  P4-T16 command registry + handler-throw settle —
#                                  session-free)
#
# dsh install (D17 cutover — pin 0.2.x, 0.1.x compatibility DROPPED): the npm
# package is @deepseek-ai/dsh and the 0.2 line is currently published as
# prereleases only. We exact-pin the rc the gates were verified against
# (0.2.0-rc.2 — the user's ruling of record: dsh 0.1.5 compatibility is dropped,
# only 0.2.x+ is adapted; the seat ids in patches/omo-dsh/omo-agents/src/
# roster.ts and the shipped preset template are re-pinned to the 0.2.x route
# catalogs IN THIS SAME CHANGE — pi-ai@0.87.1 lists deepseek-flash +
# deepseek-v4-pro and dsh-llm-deepseek@0.2.x DEFAULT_MODELS lists exactly those
# two too; deepseek-v4-flash / deepseek-v4-flash-vision-exp are 0.1.x-era ids
# that NO 0.2.x catalog lists, and the pin flip without the id re-pin is the
# T8d failure mode this pairing exists to prevent). CI no longer runs 0.1.5.
# Bump DSH_VERSION deliberately as the 0.2.x rc line advances (scripts/bump-dsh
# .sh). KNOWN FOLLOW-UP (deliberately outside this cutover commit): doctor-lite
# still enforces the old D7 minor pin (major 0, minor 1) at gate 4 — its
# PINNED_MAJOR/PINNED_MINOR constants (scripts/doctor-lite-core.ts) must flip
# to the 0.2 minor with their fixtures, tracked as the T13-side D7-assertion
# migration.
#
# Pinning the TOP-LEVEL version is NOT enough (PR #9, the lesson carries across
# generations): dsh's own dependencies use caret ranges on prereleases, so a
# plain `npm install --global @deepseek-ai/dsh@<rc>` resolves each transitive to
# the newest version satisfying its range (`^0.2.0-rc.2` satisfies any later
# 0.2.x prerelease — the family floats). A floating tree stopped hoisting the
# sandbox family once before (0.1.5-rc.3 era: @deepseek-ai/dsh-sandbox-local /
# -fs-sandbox / -sandbox-windows-acl nested under dsh-base/node_modules, the
# plugin-tree loader could not resolve the bare specifiers dsh-base/
# cordis.patch.yml declares, every boot died before readiness). CI therefore
# installs with `--before=<cutoff>`: npm's "resolve as if it were this date"
# cutoff, which freezes the whole resolved tree (transitives included).
#
# THE CUTOFF IS A SAFE POINT, NOT A PUBLISH INSTANT (PR #9 round 2; recomputed
# for 0.2.0-rc.2 at the T12b cutover). npm applies `--before` PER PACKAGE
# (`Date.parse(time[ver]) <= before`), and the dsh monorepo does not publish its
# family atomically, so the cutoff must lie strictly between the pinned version's
# FAMILY-MAX publish instant (an inclusive lower bound) and its SUCCESSOR
# family's MIN publish instant (an exclusive upper bound) — successor picked by
# PUBLISH TIME from the registry's own time map, never by semver order. For
# 0.2.0-rc.2 (registry `npm view @deepseek-ai/dsh time`, read this round):
# target 2026-09-29T09:56:27.792Z, earliest-later version 0.2.1-alpha.1 at
# 2026-10-03T04:53:22.343Z; the committed 2026-10-01T07:24:55.067Z is the
# midpoint, verified by a REAL `npm install --package-lock-only` at exactly that
# cutoff: 278/278 @deepseek-ai/dsh* lock entries at 0.2.0-rc.2, any depth
# (scripts/bump-dsh.sh's own family_verdict → `ok`). Historical note, kept as
# history: the previous cutoff 2026-09-10T09:05:02.041Z was the 0.1.5-rc.1
# midpoint (231/231 at rc.1) — it sits BEFORE 0.2.0-rc.2's publish instant and
# would ETARGET this install line; never reuse a cutoff across generations.
# This is where the pin discipline lands on the CI side;
# .github/workflows/compat-probe.yml carries the same cutoff (gate 7 d09
# asserts the two agree).
# REVISIT on every DSH_VERSION bump: scripts/bump-dsh.sh COMPUTES this safe
# point from the registry's own time map and VERIFIES it with a real
# lockfile-only resolution (bisecting up to 3 attempts) before writing either
# workflow — run it, never hand-edit the cutoff. The weekly compat-probe sentinel
# also fires on a new upstream version (scripts/compat-probe.sh installs a NEW rc
# without a cutoff on purpose — it probes the new tree, it does not reproduce
# CI's).
#
# Action majors verified against the GitHub releases API on 2026-08-20:
# checkout v7.0.1 / setup-node v7.0.0 / action-setup v6.0.10.

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_VERSION: 0.2.0-rc.2
  PNPM_VERSION: 11.9.0

jobs:
  green-set:
    name: green-set
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: setup node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: install repo deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: install dsh (D7 pin, exact rc + frozen transitive tree)
        run: |
          # --before is load-bearing: the exact version pin alone leaves every
          # caret-ranged transitive floating (see the D7 header note). Keep this
          # cutoff identical to compat-probe.yml's and re-verify it on a bump.
          npm install --global "@deepseek-ai/dsh@${DSH_VERSION}" --before=2026-10-01T07:24:55.067Z
          dsh --version

      - name: gate 1 — typecheck
        run: pnpm typecheck

      - name: gate 2 — unit tests
        run: pnpm vitest run

      - name: gate 3 — mock-LLM e2e
        run: pnpm test:e2e

      - name: gate 4 — doctor-lite
        run: node scripts/doctor-lite.mjs --json

      - name: gate 5 — license compliance
        run: scripts/verify-licenses.sh

      - name: gate 6 — concerto static
        run: node scripts/verify-concerto-static.mjs

      - name: gate 7 — docs consistency
        run: node scripts/check-docs-consistency.mjs

      # Gate 8 (2026-09-10): the session-free PROOFS. They were manual-only and
      # rotted silently — concerto-mode-probe.sh's deny assertion survived six
      # days past the F1 change that invalidated it, and prove-route-logging.mjs
      # had three separate 0.1.5-rc.1 breaks. Zero LLM cost, no network, no boot.
      - name: gate 8 — session-free proofs
        run: scripts/run-proofs.sh
